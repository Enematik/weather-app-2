<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wetter">
<meta name="theme-color" content="#0b1a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Wetter</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font:16px/1.35 -apple-system,system-ui,sans-serif;color:#fff;background:var(--bg,#1c3150) fixed;text-shadow:0 1px 3px rgba(0,0,0,.35)}
#shade{position:fixed;inset:0;background:#040818;opacity:0;transition:opacity 2s;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(80px + env(safe-area-inset-bottom))}
.c{background:rgba(10,20,40,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:18px;padding:12px 14px;margin:10px 0}
.s{position:relative}
#q{width:100%;padding:12px 44px 12px 14px;border-radius:14px;border:0;font:inherit;background:rgba(255,255,255,.92);color:#111;text-shadow:none}
#gps{position:absolute;right:4px;top:4px;border:0;background:none;font-size:22px;padding:6px 8px}
#res{position:absolute;left:0;right:0;top:48px;margin:0;padding:0;list-style:none;background:#fff;color:#111;border-radius:12px;z-index:5;overflow:hidden;text-shadow:none}
#res li{padding:10px 14px;border-bottom:1px solid #eee}
#res small{color:#666;margin-left:6px}
#fav{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.2);border:0;color:#fff;font:inherit}
.chip.on{background:rgba(255,255,255,.45)}
.hero{text-align:center;padding:14px 0 4px}
.hero h1{margin:0;font-size:24px;font-weight:600}
.hero .t{font-size:76px;font-weight:200;line-height:1.1}
.star{background:none;border:0;font-size:24px;color:#ffd54a;vertical-align:middle;padding:0 4px}
.row{display:flex;gap:16px;overflow-x:auto;text-align:center}
.row div{flex:none;min-width:48px}
.row b{display:block;font-weight:500;font-size:22px}
.d{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.d span:first-child{width:48px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;background:rgba(10,20,40,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px;border:0;background:none;color:#fff;font:inherit;opacity:.6}
nav .on{opacity:1;font-weight:600}
#v2{display:none}
#map{height:60vh;border-radius:18px;margin-top:10px}
.bar{display:flex;gap:10px;align-items:center}
.bar button{border:0;border-radius:10px;padding:8px 14px;font:inherit}
.bar input{flex:1}
.n{opacity:.8}
@media(prefers-reduced-motion:reduce){#shade{transition:none}}
</style></head><body>
<div id="shade"></div>
<main>
<div id="v1">
 <div class="s"><input id="q" placeholder="Ort suchen" autocomplete="off" enterkeyhint="search"><button id="gps" title="Mein Standort">📍</button><ul id="res"></ul></div>
 <div id="fav"></div>
 <div id="w"></div>
</div>
<div id="v2">
 <div id="map"></div>
 <div class="c bar"><button id="play">▶︎</button><input id="sl" type="range" min="0" max="0" value="0"><span id="ft">–</span></div>
 <small class="n" id="mm"></small>
</div>
</main>
<nav><button id="t1" class="on">Wetter</button><button id="t2">Radar</button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s),LS=localStorage;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const WMO={0:['Klar','c'],1:['Überwiegend klar','c'],2:['Wolkig','n'],3:['Bedeckt','n'],45:['Nebel','f'],48:['Reifnebel','f'],51:['Nieselregen','r'],53:['Nieselregen','r'],55:['Nieselregen','r'],56:['Gefrierender Niesel','r'],57:['Gefrierender Niesel','r'],61:['Leichter Regen','r'],63:['Regen','r'],65:['Starkregen','r'],66:['Gefrierender Regen','r'],67:['Gefrierender Regen','r'],71:['Leichter Schnee','s'],73:['Schnee','s'],75:['Starker Schneefall','s'],77:['Schneegriesel','s'],80:['Schauer','r'],81:['Schauer','r'],82:['Heftige Schauer','r'],85:['Schneeschauer','s'],86:['Schneeschauer','s'],95:['Gewitter','t'],96:['Gewitter mit Hagel','t'],99:['Gewitter mit Hagel','t']};
const IC={c:'☀️',n:'⛅',f:'🌫️',r:'🌧️',s:'🌨️',t:'⛈️'};
const ico=(c,day)=>{const g=(WMO[c]||['','n'])[1];return g==='c'&&!day?'🌙':g==='n'&&!day?'☁️':IC[g]};
const GR={c:['#2b7fd6','#8cc8f5'],n:['#5f7e9c','#a9bccd'],f:['#8b97a3','#c1c8cf'],r:['#3b4e63','#6c8196'],s:['#7d8fa6','#c9d6e4'],t:['#2a2f45','#55506e']};
const API='https://api.open-meteo.com/v1/forecast?current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&forecast_days=7';
let favs=[],cur=null,found=[];
const f2=n=>n.toFixed(2),same=(a,b)=>a&&b&&f2(a.lat)==f2(b.lat)&&f2(a.lon)==f2(b.lon);

// Speicher: IndexedDB (Favoriten, letzter Ort)
const kv=(w,k,v)=>new Promise((ok,no)=>{const o=indexedDB.open('wetter',1);o.onupgradeneeded=()=>o.result.createObjectStore('kv');o.onerror=no;o.onsuccess=()=>{const s=o.result.transaction('kv',w?'readwrite':'readonly').objectStore('kv'),q=w?s.put(v,k):s.get(k);q.onsuccess=()=>ok(q.result);q.onerror=no}});

// Helligkeit 0..1 nach Sonnenstand am gewählten Ort (45 min Dämmerung)
function bright(d){
  const now=Date.now()+d.utc_offset_seconds*1e3,t=s=>Date.parse(s+'Z'),w=45*6e4;
  const sr=t(d.daily.sunrise[0]),ss=t(d.daily.sunset[0]),cl=x=>Math.min(1,Math.max(0,x));
  return Math.min(cl((now-(sr-w))/(2*w)),cl((ss+w-now)/(2*w)));
}

function render(d,stale){
  const c=d.current,[txt,g]=WMO[c.weather_code]||['–','n'],b=bright(d);
  document.body.style.setProperty('--bg',`linear-gradient(${GR[g][0]},${GR[g][1]})`);
  $('#shade').style.opacity=(.72*(1-b)).toFixed(2);
  const nowH=new Date(Date.now()+d.utc_offset_seconds*1e3).toISOString().slice(0,13);
  let i=d.hourly.time.findIndex(x=>x.slice(0,13)>=nowH);if(i<0)i=0;
  const fv=favs.some(f=>same(f,cur)),H=d.hourly;
  $('#w').innerHTML=`<div class="hero"><h1>${esc(cur.name)} <button class="star" id="st" aria-label="Favorit">${fv?'★':'☆'}</button></h1><div class="t">${Math.round(c.temperature_2m)}°</div><div>${ico(c.weather_code,c.is_day)} ${txt}</div><small>Gefühlt ${Math.round(c.apparent_temperature)}° · Wind ${Math.round(c.wind_speed_10m)} km/h · ${c.relative_humidity_2m} % Feuchte</small>${stale?`<br><small class="n">Offline, Stand ${new Date(stale).toLocaleString('de-DE')}</small>`:''}</div>
  <div class="c row">${H.time.slice(i,i+24).map((t,k)=>`<div>${t.slice(11,13)} Uhr<b>${ico(H.weather_code[i+k],H.is_day[i+k])}</b>${Math.round(H.temperature_2m[i+k])}°</div>`).join('')}</div>
  <div class="c">${d.daily.time.map((t,k)=>`<div class="d"><span>${k?new Date(t+'T12:00').toLocaleDateString('de-DE',{weekday:'short'}):'Heute'}</span><span>${ico(d.daily.weather_code[k],1)}</span><span>${Math.round(d.daily.temperature_2m_min[k])}° / ${Math.round(d.daily.temperature_2m_max[k])}°</span></div>`).join('')}</div>`;
  $('#st').onclick=toggleFav;
}

async function load(p,keep){
  cur=p;kv(1,'last',p).catch(()=>{});drawFav();
  const key='w:'+f2(p.lat)+','+f2(p.lon);
  try{ // Koordinaten gerundet: datensparsam
    const r=await fetch(API+`&latitude=${f2(p.lat)}&longitude=${f2(p.lon)}`);if(!r.ok)throw 0;
    const d=await r.json();if(cur!==p)return;
    LS[key]=JSON.stringify({d,t:Date.now()});render(d);
  }catch{
    const o=LS[key];
    if(o){const x=JSON.parse(o);render(x.d,x.t)}else $('#w').innerHTML='<div class="c">Keine Daten. Bitte Verbindung prüfen.</div>';
  }
  if(map&&!keep)moveMap();
}

// Favoriten
function drawFav(){$('#fav').innerHTML=favs.map((f,i)=>`<button class="chip${same(f,cur)?' on':''}" data-i="${i}">${esc(f.name)}</button>`).join('')}
$('#fav').onclick=e=>{const i=e.target.dataset.i;if(i!=null)load(favs[i])};
async function toggleFav(){
  const j=favs.findIndex(f=>same(f,cur));j<0?favs.push(cur):favs.splice(j,1);
  await kv(1,'favs',favs).catch(()=>{});navigator.storage?.persist?.();
  drawFav();$('#st').textContent=j<0?'★':'☆';
}

// Ortssuche
let tm;
$('#q').oninput=e=>{
  clearTimeout(tm);const v=e.target.value.trim();
  if(v.length<2){$('#res').innerHTML='';return}
  tm=setTimeout(async()=>{try{
    const r=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=de&name='+encodeURIComponent(v))).json();
    found=r.results||[];
    $('#res').innerHTML=found.map((x,i)=>`<li data-i="${i}">${esc(x.name)}<small>${esc([x.admin1,x.country].filter(Boolean).join(', '))}</small></li>`).join('');
  }catch{}},300);
};
$('#res').onclick=e=>{
  const li=e.target.closest('li');if(!li)return;const x=found[li.dataset.i];
  $('#res').innerHTML='';$('#q').value='';$('#q').blur();load({name:x.name,lat:x.latitude,lon:x.longitude});
};
$('#gps').onclick=()=>navigator.geolocation?.getCurrentPosition(
  p=>load({name:'Mein Standort',lat:p.coords.latitude,lon:p.coords.longitude}),
  ()=>alert('Standort nicht verfügbar. Bitte Ort suchen oder Freigabe in den Einstellungen erlauben.'));

// Tabs
function tab(n){
  $('#v1').style.display=n==1?'':'none';$('#v2').style.display=n==2?'block':'';
  $('#t1').className=n==1?'on':'';$('#t2').className=n==2?'on':'';
  if(n==2)initMap();
}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);

// Karte + Radar (RainViewer, vergangene Frames)
let map,rl,mk,fr=[],host,fi=0,tm2=0;
const tpl=i=>`${host}${fr[i].path}/256/{z}/{x}/{y}/2/1_1.png`;
function moveMap(){if(!map)return;map.setView([cur.lat,cur.lon],6);mk.setLatLng([cur.lat,cur.lon])}
async function initMap(){
  if(map){setTimeout(()=>{map.invalidateSize();moveMap()},50);return}
  if(!window.L){$('#mm').textContent='Karte offline nicht verfügbar.';return}
  map=L.map('map',{zoomControl:false}).setView([cur.lat,cur.lon],6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'© OpenStreetMap'}).addTo(map);
  mk=L.circleMarker([cur.lat,cur.lon],{radius:7,color:'#fff',fillColor:'#e53935',fillOpacity:1}).addTo(map);
  try{
    const j=await(await fetch('https://api.rainviewer.com/public/weather-maps.json')).json();
    host=j.host;fr=j.radar.past;
    rl=L.tileLayer(tpl(fr.length-1),{opacity:.7,maxNativeZoom:7,maxZoom:12,attribution:'Radar © RainViewer'}).addTo(map);
    $('#sl').max=fr.length-1;show(fr.length-1);
  }catch{$('#mm').textContent='Radar derzeit nicht verfügbar.'}
}
function show(i){fi=i;$('#sl').value=i;rl.setUrl(tpl(i));$('#ft').textContent=new Date(fr[i].time*1e3).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
$('#sl').oninput=e=>show(+e.target.value);
$('#play').onclick=()=>{
  if(tm2){clearInterval(tm2);tm2=0;$('#play').textContent='▶︎'}
  else if(fr.length){$('#play').textContent='❚❚';tm2=setInterval(()=>show((fi+1)%fr.length),700)}
};

// Start
(async()=>{
  const dflt={name:'Berlin',lat:52.52,lon:13.41};
  try{favs=await kv(0,'favs')||[];load(await kv(0,'last')||favs[0]||dflt)}catch{load(dflt)}
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cur)load(cur,1)});
setInterval(()=>{if(!document.hidden&&cur)load(cur,1)},6e5);
</script>
</body></html>
